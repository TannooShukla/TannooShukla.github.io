<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess The Number</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(to right, #5f7aff, #feb47b);
            color: white;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 400px;
            margin: 50px auto;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        h1 {
            font-size: 24px;
        }
        input {
            width: 50px;
            padding: 5px;
            font-size: 18px;
            text-align: center;
            border-radius: 5px;
            border: none;
        }
        button {
            background: #5fc2ff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
            border-radius: 5px;
            transition: 0.3s;
        }
        button:hover {
            background: #7bedfe;
        }
        .message {
            margin-top: 10px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Guess The Number</h1>
        <p>Guess a number between 1 and 100.</p>
        <input type="number" id="guessInput" min="1" max="100">
        <button onclick="checkGuess()">Guess</button>
        <p class="message" id="message"></p>
    </div>

    <script>
        let randomNumber = Math.floor(Math.random() * 100) + 1;
        let attempts = 3;
        
        function checkGuess() {
            let userGuess = parseInt(document.getElementById('guessInput').value);
            let message = document.getElementById('message');

            if (isNaN(userGuess) || userGuess < 1 || userGuess > 100) {
                message.innerText = "Please enter a valid number between 1 and 100.";
                return;
            }

            attempts--;

            if (userGuess === randomNumber) {
                message.innerHTML = `🎉 Congratulations! You guessed the correct number: ${randomNumber}`;
                disableInput();
            } else if (userGuess < randomNumber) {
                message.innerText = `Too low! You have ${attempts} attempts left.`;
            } else {
                message.innerText = `Too high! You have ${attempts} attempts left.`;
            }

            if (attempts === 0 && userGuess !== randomNumber) {
                message.innerHTML = `😞 You Lose! The correct number was ${randomNumber}.`;
                disableInput();
            }
        }

        function disableInput() {
            document.getElementById('guessInput').disabled = true;
        }
    </script>
</body>
</html>
